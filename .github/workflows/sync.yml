# Find stable releases and propose version entries. Explicitly dispatch both
# required checks for bot PRs; trusted workflow_run automation merges only
# routine team updates with exactly unchanged permissions.
name: Sync plugin releases

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      id:
        description: 'Only this plugin id (empty: all)'
        required: false
        default: ''
  repository_dispatch:
    types: [plugin-release]

permissions:
  contents: write
  pull-requests: write
  actions: write   # dispatches the required checks for bot-generated PRs

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/regtool/go.mod
          cache: false
      - name: Sync
        env:
          GH_TOKEN: ${{ github.token }}
          REGISTRY_REPO: ${{ github.repository }}
          ONLY: ${{ github.event.inputs.id || github.event.client_payload.id || '' }}
        run: ./scripts/sync.sh "$ONLY"

