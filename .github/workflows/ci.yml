name: CI

on:
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  regtool:
    name: regtool (gofmt, go vet, go test)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: tools/regtool
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/regtool/go.mod
          cache: false
      - name: gofmt
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then echo "Not gofmt'ed:"; echo "$out"; exit 1; fi
      - run: go vet ./...
      - run: go test ./...
      - name: Automatic review policy tests
        working-directory: .
        run: python3 -m unittest discover -s tests -v
      - name: shellcheck
        working-directory: .
        run: shellcheck -x scripts/*.sh
      - name: registry.json and plugins/*.json
        working-directory: .
        run: (cd tools/regtool && go run . check -root ../..)
      - name: Report validated commit status
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS_CONTEXT: 'regtool (gofmt, go vet, go test)'
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state=success -f "context=$STATUS_CONTEXT" \
            -f "target_url=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            -f description="Validation passed on this exact commit"
