# Pull request check: registry.json and plugins/*.json are valid, and every
# changed plugins/<id>.json describes exactly the package it points to
# (checksum, manifest validated with the core's rules, reviewed permissions).
# Does not write repository contents; reports a status only after validation succeeds.
name: Check

on:
  workflow_dispatch:
    inputs:
      base:
        description: 'Base commit for checking a bot-generated PR'
        required: true
        type: string

permissions:
  contents: read
  statuses: write

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/regtool/go.mod
          cache: false
      - name: Check
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.pull_request.base.sha || inputs.base }}
        run: ./scripts/check.sh
      - name: Report validated commit status
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS_CONTEXT: 'check'
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state=success -f "context=$STATUS_CONTEXT" \
            -f "target_url=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            -f description="Validation passed on this exact commit"
